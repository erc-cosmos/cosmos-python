# Edit this file to choose packages; commit it together with pixi.lock.
[workspace]
name = "cosmos-python"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]
requires-pixi = "==0.81.0"

[dependencies]
# Python 3.11 is a starting point, not a claim that every COSMOS repo supports it.
# The lockfile pins the exact patch version and all indirect dependencies.
python = "3.11.*"
# Examples: remove the # and choose versions appropriate to your project.
# numpy = "==1.26.4"
# pandas = "==2.2.3"

[pypi-dependencies]
# Put packages unavailable on conda-forge here. Do not list a package in both sections.
# pretty-midi = "==0.2.10"
